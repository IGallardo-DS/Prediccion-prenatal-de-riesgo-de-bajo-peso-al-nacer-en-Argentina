[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bpn_clasificacion"
version = "0.0.1"
description = "Desarrollar y evaluar modelos de aprendizaje autom\u00e1tico que permitan clasificar los registros de nacimientos de Argentina seg\u00fan la presencia o ausencia de bajo peso al nacer, utilizando las variables disponibles en el conjunto de datos."
authors = [
  { name = "Ivan Gallardo" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["bpn_clasificacion"]
include = ["pyproject.toml", "bpn_clasificacion/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bpn_clasificacion"]
force-sort-within-sections = true

